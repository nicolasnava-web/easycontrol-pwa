<!DOCTYPE html> 
<html lang="pt-BR"> 

<head> 

<meta charset="UTF-8"> 

<meta 
    name="viewport" 
    content="width=device-width, initial-scale=1.0" 
> 

<meta 
    name="theme-color" 
    content="#6B3E2E" 
> 

<meta 
    name="description" 
    content="Dashboard para acompanhar seus treinos em casa" 
> 

<link rel="manifest" href="manifest.json"> 

<link rel="stylesheet" href="style.css"> 

<link rel="preconnect" href="https://fonts.googleapis.com"> 
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet"> 

<title>MyGym</title> 
```

</head> 

<body> 

```
<header class="topbar"> 

    <div> 
        <span class="small-title"> 
            MYGYM 
        </span> 

        <h1>Treino em Casa</h1> 
    </div> 

    <div class="avatar"> 
        🏋️ 
    </div> 

</header> 


<main> 

    <section class="cards"> 

        <article class="card"> 

            <span>🔥</span> 

            <p>Treinos</p> 

            <h2 id="vendas"> 
                12 
            </h2> 

        </article> 


        <article class="card"> 

            <span>⏱️</span> 

            <p>Minutos</p> 

            <h2 id="pedidos"> 
                340 
            </h2> 

        </article> 


        <article class="card"> 

            <span>💪</span> 

            <p>Exercícios</p> 

            <h2 id="clientes"> 
                48 
            </h2> 

        </article> 


        <article class="card"> 

            <span>🎯</span> 

            <p>Metas</p> 

            <h2 id="produtos"> 
                7 
            </h2> 

        </article> 

    </section> 


    <section class="section"> 

        <div class="section-title"> 

            <div> 

                <span class="tag"> 
                    ATALHOS 
                </span> 

                <h2> 
                    Ações rápidas 
                </h2> 

            </div> 

        </div> 


        <div class="actions"> 

            <button onclick="mostrarMensagem('Treino')"> 
                🏋️ Treino 
            </button> 

            <button onclick="mostrarMensagem('Exercício')"> 
                ➕ Exercício 
            </button> 

            <button onclick="mostrarMensagem('Meta')"> 
                🎯 Meta 
            </button> 

        </div> 

    </section> 


    <section class="section"> 

        <div class="section-title"> 

            <div> 

                <span class="tag"> 
                    PROGRESSO 
                </span> 

                <h2> 
                    Minutos treinados 
                </h2> 

            </div> 

        </div> 


        <div class="chart"> 

            <div 
                class="bar" 
                style="height: 45%" 
            ></div> 

            <div 
                class="bar" 
                style="height: 65%" 
            ></div> 

            <div 
                class="bar" 
                style="height: 55%" 
            ></div> 

            <div 
                class="bar" 
                style="height: 80%" 
            ></div> 

            <div 
                class="bar" 
                style="height: 70%" 
            ></div> 

            <div 
                class="bar" 
                style="height: 95%" 
            ></div> 

        </div> 

        <div class="months"> 

            <span>Seg</span> 
            <span>Ter</span> 
            <span>Qua</span> 
            <span>Qui</span> 
            <span>Sex</span> 
            <span>Sáb</span> 

        </div> 

    </section> 


    <section class="alert"> 

        <span>💡</span> 

        <div> 

            <strong> 
                Próximo treino 
            </strong> 

            <p> 
                Treino de pernas programado para hoje. 
            </p> 

        </div> 

    </section> 

</main> 


<nav class="bottom-nav"> 

    <button onclick="irPara('dashboard')"> 
        🏠 
        <span>Início</span> 
    </button> 

    <button onclick="irPara('produtos')"> 
        🏋️ 
        <span>Treinos</span> 
    </button> 

    <button onclick="irPara('vendas')"> 
        📊 
        <span>Progresso</span> 
    </button> 

    <button onclick="irPara('perfil')"> 
        👤 
        <span>Perfil</span> 
    </button> 

</nav> 


<div 
    id="toast" 
    class="toast" 
></div> 


<script src="script.js"></script> 
```

</body> 

</html>

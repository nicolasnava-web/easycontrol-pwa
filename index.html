<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <meta
        name="description"
        content="Dashboard para controle de pequenos negócios"
    >

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">

    <title>EasyControl</title>

</head>

<body>

    <header class="topbar">

        <div>
            <span class="small-title">
                EASYCONTROL
            </span>

            <h1>Dashboard</h1>
        </div>

        <div class="avatar">
            👤
        </div>

    </header>


    <main>

        <!-- RESUMO -->

        <section class="cards">

            <article class="card">

                <span>💰</span>

                <p>Vendas</p>

                <h2 id="vendas">
                    R$ 8.450
                </h2>

            </article>


            <article class="card">

                <span>🛒</span>

                <p>Pedidos</p>

                <h2 id="pedidos">
                    126
                </h2>

            </article>


            <article class="card">

                <span>👥</span>

                <p>Clientes</p>

                <h2 id="clientes">
                    84
                </h2>

            </article>


            <article class="card">

                <span>📦</span>

                <p>Produtos</p>

                <h2 id="produtos">
                    238
                </h2>

            </article>

        </section>


        <!-- AÇÕES -->

        <section class="section">

            <div class="section-title">

                <div>

                    <span class="tag">
                        ATALHOS
                    </span>

                    <h2>
                        Ações rápidas
                    </h2>

                </div>

            </div>


            <div class="actions">

                <button onclick="mostrarMensagem('Produto')">
                    ➕ Produto
                </button>

                <button onclick="mostrarMensagem('Venda')">
                    💰 Venda
                </button>

                <button onclick="mostrarMensagem('Cliente')">
                    👤 Cliente
                </button>

            </div>

        </section>


        <!-- GRÁFICO -->

        <section class="section">

            <div class="section-title">

                <div>

                    <span class="tag">
                        ANÁLISE
                    </span>

                    <h2>
                        Vendas
                    </h2>

                </div>

            </div>


            <div class="chart">

                <div
                    class="bar"
                    style="height: 45%"
                ></div>

                <div
                    class="bar"
                    style="height: 65%"
                ></div>

                <div
                    class="bar"
                    style="height: 55%"
                ></div>

                <div
                    class="bar"
                    style="height: 80%"
                ></div>

                <div
                    class="bar"
                    style="height: 70%"
                ></div>

                <div
                    class="bar"
                    style="height: 95%"
                ></div>

            </div>

            <div class="months">

                <span>Jan</span>
                <span>Fev</span>
                <span>Mar</span>
                <span>Abr</span>
                <span>Mai</span>
                <span>Jun</span>

            </div>

        </section>


        <!-- ALERTA -->

        <section class="alert">

            <span>⚠️</span>

            <div>

                <strong>
                    Estoque baixo
                </strong>

                <p>
                    5 produtos precisam
                    de reposição.
                </p>

            </div>

        </section>

    </main>


    <nav class="bottom-nav">

        <button onclick="irPara('dashboard')">
            🏠
            <span>Início</span>
        </button>

        <button onclick="irPara('produtos')">
            📦
            <span>Produtos</span>
        </button>

        <button onclick="irPara('vendas')">
            💰
            <span>Vendas</span>
        </button>

        <button onclick="irPara('perfil')">
            👤
            <span>Perfil</span>
        </button>

    </nav>


    <div
        id="toast"
        class="toast"
    ></div>


    <script src="script.js"></script>

</body>

</html>
